<!doctype html>
<!--
  <ACTION_NAME> custom widget (self-contained; inlined into ui://<ACTION_NAME>/widget.html at build time).

  Uses @adobe/llmapps-sdk, which works in every MCP Apps host (ChatGPT, Claude, Gemini, ...).
  Do not use window.openai directly: it exists only in ChatGPT.

  CSP: add https://esm.sh to the action's resourceDomains in the llm-apps UI
  (LLM Widget details > CSP Configuration), or the SDK import is blocked.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title><ACTION_NAME> widget</title>
    <style>
      body {
        margin: 0;
        padding: 12px;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #1d1d1f;
        background: transparent;
        line-height: 1.4;
      }
      body[data-theme="dark"] { color: #f5f5f7; }
      .card {
        border: 1px solid rgb(0 0 0 / 12%);
        border-radius: 8px;
        padding: 12px 14px;
      }
      .title { font-weight: 600; margin: 0 0 6px; font-size: 14px; }
      .json {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        white-space: pre-wrap;
        word-break: break-word;
        margin: 0;
      }
      .empty { color: #6e6e73; font-style: italic; margin: 0; }
    </style>
  </head>
  <body>
    <div class="card" id="root">
      <p class="title"><ACTION_NAME></p>
      <p class="empty">Loading ...</p>
    </div>

    <script type="module">
      import { createApp } from "https://esm.sh/@adobe/llmapps-sdk@0.2.1";

      const root = document.getElementById("root");

      // TODO: replace with the real UI for the handler's structuredContent.
      // Build DOM with createElement + textContent; never innerHTML with tool data.
      function render(result) {
        const title = document.createElement("p");
        title.className = "title";
        title.textContent = "<ACTION_NAME>";
        const body = document.createElement(result?.structuredContent ? "pre" : "p");
        if (result?.isError || !result?.structuredContent) {
          body.className = "empty";
          body.textContent = result?.content?.find((item) => item.type === "text")?.text
            || "No data available.";
        } else {
          body.className = "json";
          body.textContent = JSON.stringify(result.structuredContent, null, 2);
        }
        root.replaceChildren(title, body);
      }

      try {
        const app = await createApp({ appInfo: { name: "<ACTION_NAME>", version: "1.0.0" } });
        const applyTheme = (context) => {
          if (context?.theme) document.body.dataset.theme = context.theme;
        };
        applyTheme(app.hostContext);
        app.onContextChange(applyTheme);
        render(await app.toolResult);
        app.onToolResult(render);
        app.autoResize(document.body);
      } catch (error) {
        render(null);
      }
    </script>
  </body>
</html>
